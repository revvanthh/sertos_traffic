services:
  - type: web
    name: sertos-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60"
    healthCheckPath: "/api/health/"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sertos-postgres
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,127.0.0.1,localhost"
      - key: SECURE_SSL_REDIRECT
        value: "True"

databases:
  - name: sertos-postgres
    plan: free
    databaseName: sertos_db
    user: sertos_admin
